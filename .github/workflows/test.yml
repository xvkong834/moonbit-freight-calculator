name: Check and Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MOONBIT_INSTALL_VERSION: v0.10.9+6e6c44045

jobs:
  check:
    name: MoonBit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          echo "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Native toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Native toolchain (macOS)
        if: runner.os == 'macOS'
        run: xcode-select -p || sudo xcode-select --install

      - name: Toolchain information
        run: |
          moon version --all
          moon update

      - name: Check all targets
        run: moon check --deny-warn --target all

      - name: Test all targets with coverage
        run: |
          moon test --deny-warn --target all --enable-coverage
          moon coverage report -f summary
          moon coverage analyze

      - name: Verify formatting and generated interfaces
        run: |
          moon fmt
          git diff --exit-code
          moon info
          git diff --exit-code
