name: Benchmark smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONBIT_INSTALL_VERSION: v0.10.9+6e6c44045

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install stable MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Run deterministic benchmark
        run: |
          moon version --all
          moon update
          test "$(moon run benchmarks)" = "items=3000 total=CNY 269930.00"
